# data_platform/docker-compose-airflow.yml
services:

  airflow-postgres:
    image: postgres:15
    container_name: airflow_postgres

    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow

    ports:
      - "5433:5432"

    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: airflow_init

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"

    depends_on:
      - airflow-postgres

    command: >
      bash -c "
      airflow db migrate &&
      airflow users create
      --username admin
      --password admin
      --firstname Shivam
      --lastname Admin
      --role Admin
      --email admin@example.com
      "

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: airflow_webserver

    restart: always

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow

    ports:
      - "8080:8080"

    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./transform:/opt/airflow/data_platform/transform
      - ./scripts:/opt/airflow/data_platform/scripts
      - ./logs:/opt/airflow/logs
      - ./:/opt/airflow/data_platform

    depends_on:
      - airflow-postgres
      - airflow-init
    networks:
      - default
      - book_store_default
    command: webserver

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: airflow_scheduler

    restart: always

    env_file:
      - .env

    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow

    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./transform:/opt/airflow/data_platform/transform
      - ./scripts:/opt/airflow/data_platform/scripts
      - ./logs:/opt/airflow/logs
      - ./:/opt/airflow/data_platform

    depends_on:
      - airflow-postgres
    networks:
      - default
      - book_store_default

    command: scheduler

volumes:
  airflow_postgres_data:

networks:
  book_store_default:
    external: true