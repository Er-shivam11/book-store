# docker-compose.yml
version: "3.9"

services:

  db:
    image: postgres:15
    container_name: bookstore_db
    restart: always

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: redis:7
    container_name: bookstore_redis
    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  web:
    build:
      context: .
      dockerfile: ./siyaram_bookstore/Dockerfile

    container_name: bookstore_web

    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py collectstatic --noinput &&
      gunicorn siyaram_bookstore.wsgi:application --bind 0.0.0.0:8000
      "

    volumes:
      - ./siyaram_bookstore:/app
      - media_files:/app/media

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    ports:
      - "8000:8000"

    restart: always


  celery:
    build:
      context: .
      dockerfile: ./siyaram_bookstore/Dockerfile

    container_name: bookstore_celery

    command: celery -A siyaram_bookstore worker --loglevel=info

    volumes:
      - ./siyaram_bookstore:/app
      - media_files:/app/media

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: always


  celery-beat:
    build:
      context: .
      dockerfile: ./siyaram_bookstore/Dockerfile

    container_name: bookstore_celery_beat

    command: celery -A siyaram_bookstore beat --loglevel=info

    volumes:
      - ./siyaram_bookstore:/app
      - media_files:/app/media

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

    restart: always


  frontend:
    build:
      context: ./siyaram_bookstore_frontend
      dockerfile: Dockerfile
    
    container_name: bookstore_frontend
    
    volumes:
      - ./siyaram_bookstore_frontend:/app
      - /app/node_modules
    
    ports:
      - "5173:5173"
    
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_UPI_ID=${VITE_UPI_ID}
    
    # ✅ FIXED HEALTH WAIT (NO CURL REQUIRED)
    command: >
      sh -c "
      echo 'Waiting for backend...' &&
      until nc -z web 8000; do
        echo 'backend not ready yet...';
        sleep 2;
      done &&
      echo 'Backend ready. Starting frontend...' &&
      npm run dev -- --host 0.0.0.0 --port 5173
      "
    
    depends_on:
      - web
    
    restart: always


volumes:
  postgres_data:
  media_files: